# Nombre que verás en la pestaña "Actions" de GitHub
name: Deploy a tiendas-vilu.creatuapp.es

# CUÁNDO se ejecuta: cada vez que haces push a la rama main
# (workflow_dispatch te deja ejecutarlo a mano desde la pestaña Actions)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # La máquina de GitHub donde corre esto (una Linux temporal)
    runs-on: ubuntu-latest
    steps:
      # Paso 1: descarga el código de tu repo en esa máquina
      - name: Descargar el código
        uses: actions/checkout@v4

      # Paso 2: prepara la llave SSH para entrar al servidor.
      # VPS_SSH_KEY y VPS_KNOWN_HOSTS son "secrets" guardados en
      # GitHub (Settings > Secrets and variables > Actions).
      - name: Preparar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Paso 3: copia los archivos al servidor con rsync.
      # --delete borra en el servidor lo que ya no exista en el repo.
      # El usuario deploy-vilu solo puede escribir en la carpeta del sitio,
      # por eso el destino es "/" (su carpeta raíz).
      - name: Subir archivos al servidor
        run: |
          rsync -avz --delete \
            --exclude '.git' --exclude '.github' \
            --exclude 'README.md' --exclude 'LICENSE' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ deploy-vilu@185.209.229.122:/
